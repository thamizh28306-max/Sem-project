                        {/* Radius selection inside panel */}
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', background: '#f8fafc', padding: '8px 12px', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border)', marginTop: 8 }}>
                          <span style={{ fontSize: '0.78rem', fontWeight: 600, color: 'var(--slate2)' }}>Amenity Radius:</span>
                          <div style={{ display: 'flex', gap: 6 }}>
                            {[500, 1000, 2000].map(r => (
                              <button
                                key={r}
                                className={`map-chip ${radius === r ? 'active' : ''}`}
                                style={{ padding: '3px 10px', fontSize: '0.74rem' }}
                                onClick={() => setRadius(r)}
                              >
                                {r < 1000 ? `${r}m` : `${r / 1000} km`}
                              </button>
                            ))}
                          </div>
                        </div>

                        {/* 2. Gather Information for Estimation Form (Dynamic by Property Type) */}
                        <div style={{ marginTop: 14, borderTop: '1px solid var(--border)', paddingTop: 14 }}>
                          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
                            <div style={{ fontSize: '0.92rem', fontWeight: 700, color: 'var(--slate)' }}>
                              📋 Gather Information for Estimation
                            </div>
                            <span style={{ fontSize: '0.7rem', color: 'var(--g600)', background: 'var(--g50)', padding: '2px 8px', borderRadius: 999, fontWeight: 600 }}>Dynamic Form</span>
                          </div>
                          <div style={{ fontSize: '0.76rem', color: 'var(--muted)', marginBottom: 12 }}>
                            Auto-filled from location &amp; nearby amenities. Fields marked with * are required.
                          </div>

                          {/* 2.1 Property Type Selector */}
                          <div className="form-group" style={{ marginBottom: 12 }}>
                            <label className="form-label" style={{ fontWeight: 700, color: 'var(--slate)' }}>
                              Property Type *
                            </label>
                            <select
                              className="form-select"
                              style={{ fontWeight: 600, background: '#f8fafc', borderColor: 'var(--g500)' }}
                              value={form.property_type}
                              onChange={e => setF('property_type', e.target.value)}
                            >
                              <option value="Apartment/Flat">🏢 Apartment / Flat</option>
                              <option value="Independent House/Villa">🏡 Independent House / Villa</option>
                              <option value="Residential Plot">🌿 Residential Plot</option>
                              <option value="Commercial">🏬 Commercial (Shop/Office/Showroom)</option>
                              <option value="Other">🏭 Other (Warehouse, Farmland, etc.)</option>
                            </select>
                          </div>

                          {/* 2.2 Fields by Type */}
                          <div className="form-grid" style={{ gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 10 }}>
                            {/* Locality (Common) */}
                            <div className="form-group full" style={{ gridColumn: 'span 2' }}>
                              <label className="form-label">Locality *</label>
                              <select className="form-select" value={form.locality} onChange={e => {
                                const newLoc = e.target.value;
                                setF('locality', newLoc);
                                const locObj = (coverageData.localities || DEFAULT_LOCALITIES).find(l => l.name === newLoc);
                                if (locObj) {
                                  const badge = resolveCoverageBadge(locObj.centroid.lat, locObj.centroid.lng, newLoc);
                                  setCoverageBadge(badge);
                                }
                              }}>
                                {(coverageData.localities || DEFAULT_LOCALITIES).map(l => (
                                  <option key={l.name} value={l.name}>
                                    {l.name} {l.status === 'assumed' ? '(approx.)' : ''}
                                  </option>
                                ))}
                              </select>
                            </div>

                            {/* Area (Common) */}
                            <div className="form-group">
                              <label className="form-label">
                                {form.property_type === 'Residential Plot' ? 'Plot Area (sq ft) *' : 'Built-up Area (sq ft) *'}
                              </label>
                              <input className="form-input" type="number" value={form.area} onChange={e => setF('area', e.target.value)} placeholder="e.g. 1200" />
                            </div>

                            {/* Plot Area for House/Villa */}
                            {form.property_type === 'Independent House/Villa' && (
                              <div className="form-group">
                                <label className="form-label">Plot Area (sq ft)</label>
                                <input className="form-input" type="number" value={form.built_up_area} onChange={e => setF('built_up_area', e.target.value)} placeholder="e.g. 1500" />

                            {/* Road width (Common) */}
                            <div className="form-group">
                              <label className="form-label">Road Width (ft)</label>
                              <select className="form-select" value={form.road_width} onChange={e => setF('road_width', e.target.value)}>

                                  <option key={w} value={w}>{w} feet</option>

                              </select>

                            <div className="form-group">
                              <label className="form-label">Approval Status</label>
                              <select className="form-select" value={form.approved} onChange={e => setF('approved', e.target.value)}>

                                <option value="Unapproved">Unapproved</option>
                                <option value="Not sure">Not sure</option>
                              </select>
                            </div>

                            {/* Corner property (Common) */}
                            <div className="form-group">
                              <label className="form-label">Corner Property</label>
                              <select className="form-select" value={form.corner} onChange={e => setF('corner', e.target.value)}>
                                <option value="no">No</option>
                                <option value="yes">Yes (+Corner)</option>
                              </select>
                            </div>

                            {/* Flood-prone (Common) */}
                            <div className="form-group">
                              <label className="form-label">Flood-prone Area</label>
                              <select className="form-select" value={form.flood_prone} onChange={e => setF('flood_prone', e.target.value)}>
                                <option value="no">No (Safe)</option>
                                <option value="yes">Yes (Low-lying/Prone)</option>
                              </select>
                            </div>

                            {/* INDEPENDENT HOUSE / VILLA SPECIFIC */}
                            {form.property_type === 'Independent House/Villa' && (
                              <>
                                <div className="form-group">
                                  <label className="form-label">BHK</label>
                                  <select className="form-select" value={form.bhk} onChange={e => setF('bhk', e.target.value)}>
                                    {['1','2','3','4','5','6'].map(v => <option key={v} value={v}>{v} BHK</option>)}
                                  </select>
                                </div>
                                <div className="form-group">
                                  <label className="form-label">Bathrooms</label>
                                  <select className="form-select" value={form.bathrooms} onChange={e => setF('bathrooms', e.target.value)}>
                                    {['1','2','3','4','5'].map(v => <option key={v} value={v}>{v}</option>)}
                                  </select>
                                </div>
                                <div className="form-group">
                                  <label className="form-label">Building Age (yrs)</label>
                                  <input className="form-input" type="number" min="0" value={form.age} onChange={e => setF('age', e.target.value)} placeholder="0" />
                                </div>
                                <div className="form-group">
                                  <label className="form-label">Building Floors</label>
                                  <select className="form-select" value={form.total_floors} onChange={e => setF('total_floors', e.target.value)}>
                                    {['1 (G)', '2 (G+1)', '3 (G+2)', '4'].map((v, i) => <option key={v} value={i+1}>{v}</option>)}
                                  </select>
                                </div>
                                <div className="form-group">
                                  <label className="form-label">Parking</label>
                                  <select className="form-select" value={form.parking} onChange={e => setF('parking', e.target.value)}>
                                    <option value="none">None</option>
                                    <option value="bike">Bike only</option>
                                    <option value="1 car">1 Car</option>
                                    <option value="2+ cars">2+ Cars</option>
                                  </select>
                                </div>
                                <div className="form-group">
                                  <label className="form-label">Facing</label>
                                  <select className="form-select" value={form.facing} onChange={e => setF('facing', e.target.value)}>
                                    {['North', 'South', 'East', 'West', 'North-East', 'North-West', 'South-East', 'South-West'].map(f => (
                                      <option key={f} value={f}>{f}</option>
                                    ))}
                                  </select>
                                </div>
                                  <div className="form-group full" style={{ gridColumn: 'span 2' }}>
                                    <label className="form-label">Furnishing</label>
                                    <select className="form-select" value={form.furnished} onChange={e => setF('furnished', e.target.value)}>
                                      <option value="0">Unfurnished</option>
                                      <option value="1">Semi-furnished</option>
                                      <option value="2">Fully furnished</option>
                                    </select>
                                  </div>
                                  <GeoTechSection form={form} setF={setF} />
                                </>
                              )}

                            {/* APARTMENT / FLAT SPECIFIC */}
                            {form.property_type === 'Apartment/Flat' && (
                              <>
                                <div className="form-group">
                                  <label className="form-label">BHK</label>
                                  <select className="form-select" value={form.bhk} onChange={e => setF('bhk', e.target.value)}>
                                    {['1','2','3','4','5'].map(v => <option key={v} value={v}>{v} BHK</option>)}
                                  </select>
                                </div>
                                <div className="form-group">
                                  <label className="form-label">Bathrooms</label>
                                  <select className="form-select" value={form.bathrooms} onChange={e => setF('bathrooms', e.target.value)}>
                                    {['1','2','3','4','5'].map(v => <option key={v} value={v}>{v}</option>)}
                                  </select>
                                </div>
                                <div className="form-group">
                                  <label className="form-label">Floor Number</label>
                                  <input className="form-input" type="number" min="0" value={form.floor} onChange={e => setF('floor', e.target.value)} placeholder="e.g. 3" />
                                </div>
                                <div className="form-group">
                                  <label className="form-label">Total Floors</label>
                                  <input className="form-input" type="number" min="1" value={form.total_floors} onChange={e => setF('total_floors', e.target.value)} placeholder="e.g. 10" />
                                </div>
                                <div className="form-group">
                                  <label className="form-label">Building Age (yrs)</label>
                                  <input className="form-input" type="number" min="0" value={form.age} onChange={e => setF('age', e.target.value)} placeholder="e.g. 5" />
                                </div>
                                <div className="form-group">
                                  <label className="form-label">Parking</label>
                                  <select className="form-select" value={form.parking} onChange={e => setF('parking', e.target.value)}>
                                    <option value="none">None</option>
                                    <option value="bike">Bike only</option>
                                    <option value="1 car">1 Car</option>
                                    <option value="2+ cars">2+ Cars</option>
                                  </select>
                                </div>
                                <div className="form-group">
                                  <label className="form-label">Lift Available</label>
                                  <select className="form-select" value={form.lift} onChange={e => setF('lift', e.target.value)}>
                                    <option value="yes">Yes</option>
                                    <option value="no">No</option>
                                  </select>
                                </div>
                                <div className="form-group">
                                  <label className="form-label">Power Backup</label>

    // ── Auth ──────────────────────────────────────────────────────────────────────
    function AuthModal({ onClose, setUser }) {
      const [tab, setTab] = useState('login');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [loginForm, setLoginForm] = useState({ email: '', password: '' });
      const [regForm, setRegForm] = useState({ name: '', email: '', phone: '', password: '' });

      const switchTab = (t) => {
        setTab(t);
        setError('');
        setLoginForm({ email: '', password: '' });
        setRegForm({ name: '', email: '', phone: '', password: '' });
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        try {
          const res = await fetch(`${API}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ email: loginForm.email, password: loginForm.password })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || data.error || 'Invalid credentials');
          setToken(data.accessToken || data.token);
          setUser(data.user);
          onClose();
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleRegister = async (e) => {
        e.preventDefault();
        if (regForm.password.length < 10) {
          setError('Password must be at least 10 characters');
          return;
        }
        setLoading(true);
        setError('');
        try {
          const res = await fetch(`${API}/api/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ name: regForm.name, email: regForm.email, phone: regForm.phone, password: regForm.password })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || data.error || 'Registration failed');
          setToken(data.accessToken || data.token);
          setUser(data.user);
          onClose();
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 440 }}>
            <button className="modal-close" onClick={onClose}>✕</button>
            <div style={{ textAlign: 'center', marginBottom: 24 }}>
              <div style={{ fontFamily: 'var(--font-head)', fontWeight: 800, fontSize: '1.4rem', color: 'var(--slate)', marginBottom: 4 }}>Data<span style={{ color: 'var(--g600)' }}>Zen</span></div>
              <p style={{ fontSize: '0.85rem', color: 'var(--muted)' }}>{tab === 'login' ? 'Welcome back! Sign in to your account.' : 'Create a new account to get started.'}</p>
            </div>
            <div style={{ display: 'flex', borderBottom: '2px solid var(--border)', marginBottom: 24 }}>
              {[['login', 'Login'], ['register', 'Register']].map(([v, label]) => (
                <button key={v} onClick={() => switchTab(v)} style={{
                  flex: 1, padding: '10px 0', fontSize: '0.9rem', fontWeight: 600, cursor: 'pointer', border: 'none', background: 'none',
                  fontFamily: 'var(--font-body)', color: tab === v ? 'var(--g700)' : 'var(--muted)',
                  borderBottom: tab === v ? '2px solid var(--g600)' : '2px solid transparent', marginBottom: -2, transition: 'var(--transition)'
                }}>{label}</button>
              ))}
            </div>

            {tab === 'login' && (
              <form onSubmit={handleLogin}>
                <div className="form-group" style={{ marginBottom: 14 }}>
                  <label className="form-label">Email</label>
                  <input className="form-input" type="email" required value={loginForm.email} onChange={e => setLoginForm(f => ({ ...f, email: e.target.value }))} placeholder="you@example.com" />
                </div>
                <div className="form-group" style={{ marginBottom: 20 }}>
                  <label className="form-label">Password</label>
                  <input className="form-input" type="password" required value={loginForm.password} onChange={e => setLoginForm(f => ({ ...f, password: e.target.value }))} placeholder="••••••••" />
                </div>
                {error && <p style={{ color: '#ef4444', fontSize: '0.85rem', marginBottom: 14, textAlign: 'center' }}>{error}</p>}
                <button className="predict-btn" type="submit" disabled={loading}>
                  {loading ? <><div className="spinner" /> Signing in...</> : 'Login'}
                </button>
              </form>
            )}

            {tab === 'register' && (
              <form onSubmit={handleRegister}>
                <div className="form-group" style={{ marginBottom: 14 }}>
                  <label className="form-label">Full Name</label>
                  <input className="form-input" type="text" required value={regForm.name} onChange={e => setRegForm(f => ({ ...f, name: e.target.value }))} placeholder="e.g. Arjun Kumar" />
                </div>
                <div className="form-group" style={{ marginBottom: 14 }}>
                  <label className="form-label">Email</label>
                  <input className="form-input" type="email" required value={regForm.email} onChange={e => setRegForm(f => ({ ...f, email: e.target.value }))} placeholder="you@example.com" />
                </div>
                <div className="form-group" style={{ marginBottom: 14 }}>
                  <label className="form-label">Phone <span style={{ color: 'var(--muted)', fontWeight: 400 }}>(optional)</span></label>
                  <input className="form-input" type="tel" value={regForm.phone} onChange={e => setRegForm(f => ({ ...f, phone: e.target.value }))} placeholder="9876543210" />
                </div>
                <div className="form-group" style={{ marginBottom: 20 }}>
                  <label className="form-label">Password <span style={{ color: 'var(--muted)', fontWeight: 400 }}>(min 6 chars)</span></label>
                  <input className="form-input" type="password" required minLength={6} value={regForm.password} onChange={e => setRegForm(f => ({ ...f, password: e.target.value }))} placeholder="••••••••" />

    // ─── App ─────────────────────────────────────────────────────────────────────
    function App() {
      const [page, setPage] = useState('home');
      const [user, setUser] = useState(null);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [predictionDistances, setPredictionDistances] = useState(null);

      useEffect(() => {
        // Attempt silent session restoration via httpOnly refresh cookie
        fetch(`${API}/api/auth/refresh`, { method: 'POST', credentials: 'include' })
          .then(res => {
            if (!res.ok) throw new Error('No active session');
            return res.json();
          })
          .then(data => {
            const token = data.accessToken || data.token;
            setToken(token);
            return fetch(`${API}/api/auth/me`, {
              headers: { 'Authorization': `Bearer ${token}` }
            });
          })
          .then(res => {
            if (!res.ok) throw new Error('Invalid user');
            return res.json();
          })
          .then(userData => setUser(userData))
          .catch(() => {
            clearToken();
            setUser(null);
          });
      }, []);

      useEffect(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, [page]);

      const handleUseForPrediction = (school, metro) => {
        setPredictionDistances({ school, metro });
        setPage('predict');
      };

      return (
        <div>
          <Nav page={page} setPage={setPage} user={user} setUser={setUser} setShowAuthModal={setShowAuthModal} />
          {showAuthModal && <AuthModal onClose={() => setShowAuthModal(false)} setUser={setUser} />}
          {page === 'home' && <HomePage setPage={setPage} />}
          {page === 'listings' && <ListingsPage />}
          {page === 'predict' && <PredictPage predictionDistances={predictionDistances} />}
          {page === 'map' && <MapPage setPage={setPage} onUseForPrediction={handleUseForPrediction} />}
          {page === 'sell' && <SellPage user={user} setShowAuthModal={setShowAuthModal} setPage={setPage} />}
          <Footer setPage={setPage} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
