<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com https://cdnjs.cloudflare.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' https://fonts.googleapis.com https://unpkg.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src * data: blob:; connect-src 'self' http://localhost:3000 https://nominatim.openstreetmap.org https://overpass-api.de https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; frame-ancestors 'none';">
  <title>DataZen — Smart Property Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
    rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --g50: #f0fdf4;
      --g100: #dcfce7;
      --g200: #bbf7d0;
      --g300: #86efac;
      --g400: #4ade80;
      --g500: #22c55e;
      --g600: #16a34a;
      --g700: #15803d;
      --g800: #166534;
      --g900: #14532d;
      --slate: #0f172a;
      --slate2: #1e293b;
      --slate3: #334155;
      --muted: #64748b;
      --border: #e2e8f0;
      --white: #ffffff;
      --card: #ffffff;
      --bg: #f8fafb;
      --font-head: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 8px 40px rgba(0, 0, 0, 0.10);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--slate);
      overflow-x: hidden;
    }

    /* scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--g50);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--g300);
      border-radius: 999px;
    }

    /* animations */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(28px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -200% center;
      }

      100% {
        background-position: 200% center;
      }
    }

    @keyframes pulse-dot {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.4);
        opacity: 0.6;
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes slide-in {
      from {
        opacity: 0;
        transform: translateX(-16px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes count-up {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-up {
      animation: fadeUp 0.6s ease both;
    }

    .fade-up-d1 {
      animation-delay: 0.1s;
    }

    .fade-up-d2 {
      animation-delay: 0.2s;
    }

    .fade-up-d3 {
      animation-delay: 0.3s;
    }

    .fade-up-d4 {
      animation-delay: 0.4s;
    }

    .fade-up-d5 {
      animation-delay: 0.5s;
    }

    /* nav */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(34, 197, 94, 0.12);
      padding: 0 5%;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 1.4rem;
      color: var(--slate);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .nav-logo span {
      color: var(--g600);
    }

    .nav-logo-dot {
      width: 8px;
      height: 8px;
      background: var(--g500);
      border-radius: 50%;
      animation: pulse-dot 2s ease-in-out infinite;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .nav-link {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      padding: 4px 0;
      background: none;
      border: none;
      font-family: var(--font-body);
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--g500);
      border-radius: 1px;
      transform: scaleX(0);
      transition: var(--transition);
      transform-origin: left;
    }

    .nav-link:hover {
      color: var(--g700);
    }

    .nav-link:hover::after {
      transform: scaleX(1);
    }

    .nav-link.active {
      color: var(--g700);
    }

    .nav-link.active::after {
      transform: scaleX(1);
    }

    .nav-cta {
      background: var(--g600);
      color: white;
      border: none;
      cursor: pointer;
      padding: 10px 22px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      font-family: var(--font-body);
      transition: var(--transition);
    }

    .nav-cta:hover {
      background: var(--g700);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(22, 163, 74, 0.35);
    }

    /* hero */
    .hero {
      min-height: 100vh;
      padding-top: 68px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 120px 5% 80px;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(34, 197, 94, 0.08) 0%, transparent 70%);
    }

    .hero-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      z-index: 0;
      animation: float 6s ease-in-out infinite;
    }

    .hero-orb-1 {
      width: 400px;
      height: 400px;
      background: rgba(34, 197, 94, 0.07);
      top: -100px;
      right: -80px;
    }

    .hero-orb-2 {
      width: 300px;
      height: 300px;
      background: rgba(74, 222, 128, 0.06);
      bottom: 0;
      left: -60px;
      animation-delay: 3s;
    }

    .hero-grid {
      position: absolute;
      inset: 0;
      z-index: 0;
      opacity: 0.4;
      background-image: linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 70% 50% at 50% 50%, black, transparent);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 800px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--g50);
      border: 1px solid var(--g200);
      color: var(--g700);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 500;
      margin-bottom: 28px;
    }

    .hero-badge-dot {
      width: 6px;
      height: 6px;
      background: var(--g500);
      border-radius: 50%;
      animation: pulse-dot 1.5s infinite;
    }

    .hero-h1 {
      font-family: var(--font-head);
      font-size: clamp(2.8rem, 6vw, 4.5rem);
      font-weight: 800;
      line-height: 1.1;
      color: var(--slate);
      margin-bottom: 24px;
    }

    .hero-h1 em {
      font-style: normal;
      color: var(--g600);
    }

    .hero-sub {
      font-size: 1.15rem;
      color: var(--muted);
      line-height: 1.7;
      max-width: 560px;
      margin: 0 auto 40px;
      font-weight: 300;
    }

    .hero-actions {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: var(--g600);
      color: white;
      border: none;
      cursor: pointer;
      padding: 14px 32px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 600;
      font-family: var(--font-body);
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary:hover {
      background: var(--g700);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(22, 163, 74, 0.35);
    }

    .btn-secondary {
      background: white;
      color: var(--slate);
      border: 1.5px solid var(--border);
      cursor: pointer;
      padding: 14px 32px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 500;
      font-family: var(--font-body);
      transition: var(--transition);
    }

    .btn-secondary:hover {
      border-color: var(--g400);
      color: var(--g700);
      transform: translateY(-2px);
    }

    .hero-stats {
      display: flex;
      gap: 48px;
      justify-content: center;
      margin-top: 64px;
      padding-top: 40px;
      border-top: 1px solid var(--border);
    }

    .hero-stat {
      text-align: center;
    }

    .hero-stat-num {
      font-family: var(--font-head);
      font-size: 2rem;
      font-weight: 800;
      color: var(--g700);
    }

    .hero-stat-label {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* sections */
    .section {
      padding: 96px 5%;
    }

    .section-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-label {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--g600);
      background: var(--g50);
      border: 1px solid var(--g200);
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 16px;
    }

    .section-title {
      font-family: var(--font-head);
      font-size: clamp(1.8rem, 3.5vw, 2.6rem);
      font-weight: 800;
      color: var(--slate);
      line-height: 1.2;
      margin-bottom: 16px;
    }

    .section-sub {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 520px;
      line-height: 1.7;
      font-weight: 300;
    }

    /* features grid */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 52px;
    }

    .feature-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      transition: var(--transition);
      cursor: default;
      position: relative;
      overflow: hidden;
    }

    .feature-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--g400), var(--g600));
      opacity: 0;
      transition: var(--transition);
    }

    .feature-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: var(--g200);
    }

    .feature-card:hover::before {
      opacity: 1;
    }

    .feature-icon {
      width: 48px;
      height: 48px;
      background: var(--g50);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      margin-bottom: 18px;
    }

    .feature-title {
      font-family: var(--font-head);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--slate);
      margin-bottom: 8px;
    }

    .feature-desc {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.65;
      font-weight: 300;
    }

    /* how it works */
    .how-bg {
      background: var(--g50);
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0;
      margin-top: 52px;
      position: relative;
    }

    .step {
      padding: 32px 24px;
      position: relative;
    }

    .step-num {
      font-family: var(--font-head);
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--g200);
      line-height: 1;
      margin-bottom: 16px;
    }

    .step-title {
      font-family: var(--font-head);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--slate);
      margin-bottom: 8px;
    }

    .step-desc {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.65;
    }

    .step-arrow {
      position: absolute;
      right: -12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--g300);
      font-size: 1.4rem;
      z-index: 1;
    }

    /* listings */
    .listings-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .filter-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      border: 1.5px solid var(--border);
      background: white;
      color: var(--muted);
      font-family: var(--font-body);
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: var(--g600);
      color: white;
      border-color: var(--g600);
    }

    .listings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 22px;
    }

    .listing-card {
      background: white;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      transition: var(--transition);
      cursor: pointer;
    }

    .listing-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: var(--g200);
    }

    .listing-img {
      height: 190px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, var(--g100), var(--g200));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .listing-img-emoji {
      font-size: 4rem;
    }

    .listing-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--g600);
      color: white;
    }

    .listing-badge.rent {
      background: var(--slate2);
    }

    .listing-price-tag {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: white;
      color: var(--g700);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      font-family: var(--font-head);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
    }

    .listing-body {
      padding: 18px 20px;
    }

    .listing-name {
      font-family: var(--font-head);
      font-size: 1rem;
      font-weight: 700;
      color: var(--slate);
      margin-bottom: 4px;
    }

    .listing-loc {
      font-size: 0.83rem;
      color: var(--muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .listing-meta {
      display: flex;
      gap: 16px;
    }

    .listing-meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .listing-actions {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      border-top: 1px solid var(--g50);
    }

    .listing-btn {
      flex: 1;
      padding: 9px;
      border-radius: 8px;
      font-size: 0.83rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      border: none;
      font-family: var(--font-body);
      text-align: center;
    }

    .listing-btn-primary {
      background: var(--g600);
      color: white;
    }

    .listing-btn-primary:hover {
      background: var(--g700);
    }

    .listing-btn-secondary {
      background: var(--g50);
      color: var(--g700);
      border: 1px solid var(--g200);
    }

    .listing-btn-secondary:hover {
      background: var(--g100);
    }

    /* predict form */
    .predict-section {
      background: white;
    }

    .predict-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: start;
      margin-top: 48px;
    }

    .predict-form-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px;
      box-shadow: var(--shadow);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--slate3);
    }

    .form-input,
    .form-select {
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.93rem;
      font-family: var(--font-body);
      color: var(--slate);
      transition: var(--transition);
      background: var(--bg);
      outline: none;
    }

    .form-input:focus,
    .form-select:focus {
      border-color: var(--g500);
      background: white;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
    }

    .form-input::placeholder {
      color: #b0bec5;
    }

    .toggle-group {
      display: flex;
      gap: 10px;
    }

    .toggle-btn {
      flex: 1;
      padding: 11px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      font-family: var(--font-body);
    }

    .toggle-btn.active {
      background: var(--g600);
      color: white;
      border-color: var(--g600);
    }

    .predict-btn {
      width: 100%;
      padding: 15px;
      background: var(--g600);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-body);
      transition: var(--transition);
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .predict-btn:hover {
      background: var(--g700);
      box-shadow: 0 6px 24px rgba(22, 163, 74, 0.3);
    }

    .predict-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    /* result panel */
    .result-panel {
      background: linear-gradient(135deg, var(--g900), var(--g700));
      border-radius: var(--radius);
      padding: 36px;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .result-panel::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 200px;
      height: 200px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
    }

    .result-label {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.7;
      margin-bottom: 10px;
    }

    .result-price {
      font-family: var(--font-head);
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      line-height: 1;
      margin-bottom: 6px;
      animation: count-up 0.6s ease;
    }

    .result-per-sqft {
      font-size: 0.9rem;
      opacity: 0.75;
      margin-bottom: 28px;
    }

    .result-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.15);
      margin-bottom: 24px;
    }

    .result-breakdown {

      LOCALITY_BASE[l.name] = l.base_rate_per_sqft;
      LOCALITY_STATUS[l.name] = l.status;
    });

    const LOCALITIES = DEFAULT_LOCALITIES.map(l => l.name);

    const MAP_PINS = [
      { top: "30%", left: "25%", locality: "Anna Nagar", price: "₹8,500/sqft", color: "#16a34a" },
      { top: "50%", left: "60%", locality: "Velachery", price: "₹7,200/sqft", color: "#15803d" },

      { top: "40%", left: "45%", locality: "T Nagar", price: "₹8,800/sqft", color: "#14532d" },
    ];

    function predictPrice(form) {
      const base = LOCALITY_BASE[form.locality] || 7000;
      let price = base * parseInt(form.area || 1000);
      price += parseInt(form.bhk || 2) * 45000;
      price -= parseInt(form.age || 0) * 7500;
      price += parseInt(form.floor || 1) * 2800;
      price += form.parking === "yes" ? 22000 : 0;
      price -= parseFloat(form.school_dist || 1) * 9000;
      price -= parseFloat(form.metro_dist || 2) * 7500;
      price = Math.max(price, 800000);
      const noise = (Math.random() - 0.5) * 0.04 * price;
      return Math.round(price + noise);
    }

    function formatPrice(p) {
      if (p >= 10000000) return `₹${(p / 10000000).toFixed(2)} Cr`;
      if (p >= 100000) return `₹${(p / 100000).toFixed(1)} L`;
      return `₹${p.toLocaleString('en-IN')}`;
    }

    // ─── Predict Page ─────────────────────────────────────────────────────────────
    function PredictPage({ predictionDistances }) {
      const [form, setForm] = useState({
        locality: 'Anna Nagar', area: '1200', bhk: '2', age: '5',
        floor: '3', parking: 'yes', school_dist: '0.8', metro_dist: '2.1', type: 'residential', furnished: '0'
      });
      const [result, setResult] = useState(null);
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        if (predictionDistances) {
          setForm(f => ({
            ...f,
            school_dist: predictionDistances.school != null ? String(predictionDistances.school) : f.school_dist,
            metro_dist: predictionDistances.metro != null ? String(predictionDistances.metro) : f.metro_dist,
          }));
        }
      }, [predictionDistances]);

      const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

      const handlePredict = async () => {
        setLoading(true);
        setResult(null);
        try {
          const parseDist = (v) => (v !== '' && v !== null && v !== undefined && !isNaN(Number(v))) ? Number(v) : null;
          const res = await fetch(`${API}/api/predict`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              locality: form.locality,
              area_sqft: parseInt(form.area) || 1200,
              bhk: parseInt(form.bhk) || 2,
              age_years: parseInt(form.age) || 5,
              floor: parseInt(form.floor) || 3,
              parking: form.parking === 'yes' ? 1 : 0,
              school_dist_km: parseDist(form.school_dist),
              metro_dist_km: parseDist(form.metro_dist),
              furnished: parseInt(form.furnished) || 0
            })
          });
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            let errMsg = 'Prediction failed';
            if (errData.detail) {
              if (typeof errData.detail === 'string') errMsg = errData.detail;
              else if (errData.detail.message) errMsg = errData.detail.message;
              else if (errData.detail.errors) errMsg = errData.detail.errors.map(e => e.message || e.msg).join('; ');
            } else if (errData.message) errMsg = errData.message;
            else if (errData.errors) errMsg = errData.errors.map(e => e.message).join('; ');
            else if (errData.error) errMsg = errData.error;
            throw new Error(errMsg);
          }
          const data = await res.json();

        } catch (err) {

        } finally {

        }
      };

      return (

                {result && !loading && !result.error && (

                        ['🅿️', form.parking === 'yes' ? 'Parking available' : 'No parking', form.parking === 'yes' ? 'pos' : 'neg', form.parking === 'yes' ? '+₹22K' : '−Value'],

    }

    // ── Map ───────────────────────────────────────────────────────────────────────
    const HAVERSINE = (lat1, lng1, lat2, lng2) => {
      const R = 6371, toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2-lat1), dLng = toRad(lng2-lng1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    };
    const CATEGORIES_ORDER = [
      'school',
      'college',
      'hospital',
      'clinic',
      'pharmacy',
      'supermarket',
      'restaurant',
      'bank',
      'park',
      'bus',
      'metro',
    ];

    const CATEGORY_META = {
      school:        { label: 'Schools',              emoji: '🏫', color: '#f59e0b' },
      college:       { label: 'Colleges',             emoji: '🎓', color: '#8b5cf6' },
      hospital:      { label: 'Hospitals',            emoji: '🏥', color: '#ef4444' },
      clinic:        { label: 'Clinics',              emoji: '⚕️', color: '#f87171' },
      pharmacy:      { label: 'Pharmacies',           emoji: '💊', color: '#fb923c' },
      supermarket:   { label: 'Supermarkets',         emoji: '🛒', color: '#22c55e' },
      restaurant:    { label: 'Restaurants',          emoji: '🍽️', color: '#ec4899' },
      bank:          { label: 'Banks / ATMs',         emoji: '🏦', color: '#3b82f6' },
      bank_atm:      { label: 'Banks / ATMs',         emoji: '🏦', color: '#3b82f6' }, // backward compatibility
      park:          { label: 'Parks',                emoji: '🌳', color: '#10b981' },
      bus:           { label: 'Bus Stops / Stations', emoji: '🚌', color: '#f97316' },
      bus_stop:      { label: 'Bus Stops / Stations', emoji: '🚌', color: '#f97316' }, // backward compatibility
      metro:         { label: 'Metro / Railway',      emoji: '🚇', color: '#0ea5e9' },
      metro_station: { label: 'Metro / Railway',      emoji: '🚇', color: '#0ea5e9' }, // backward compatibility
    };

    // ── Tile Configuration & OSM Usage Policy ────────────────────────────────
    // Production note: For high-traffic production deployments, do not use free
    // public osm.org or CARTO tiles directly. Instead, consider:
    //  1. Self-hosted tile server using OpenMapTiles / tilemaker / renderd.
    //  2. Managed provider with generous free tiers (MapTiler, Stadia Maps, Jawg).
    //  3. Proactive caching via CDN / Tile proxy adhering to provider terms.
    const MAP_CONFIG = {
      tileUrl: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors',
      fallbackTileUrl: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
      fallbackAttribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener noreferrer">CARTO</a>',
      maxZoom: 19
    };

    function MapPage({ setPage, onUseForPrediction }) {
      const [clickedLocation, setClickedLocation] = useState(null);
      const [showPanel, setShowPanel] = useState(false);
      const mapContainerRef = useRef(null);
      const leafletMapRef   = useRef(null);
      const markerRef       = useRef(null);
      const radiusCircleRef = useRef(null);
      const nearbyLayerRef  = useRef(null);
      const tileErrorCountRef = useRef(0);
      const fallbackActiveRef = useRef(false);

      // Search state (Instant local suggestions + on-demand external geocoding)
      const [searchQuery, setSearchQuery] = useState('');
      const [localSuggestions, setLocalSuggestions] = useState([]);
      const [externalResults, setExternalResults] = useState([]);
      const [searchLoading, setSearchLoading] = useState(false);
      const [searchError, setSearchError] = useState('');
      const [showSearchDropdown, setShowSearchDropdown] = useState(false);
      const searchReqIdRef = useRef(0);
      const searchCacheRef = useRef({});

      // Radius & filters
      const [radius, setRadius] = useState(1000);
      const [activeCategories, setActiveCategories] = useState(new Set(Object.keys(CATEGORY_META)));

      // Rich dynamic form state supporting all property types
      const [form, setForm] = useState({
        property_type: 'Apartment/Flat',
        locality: 'Anna Nagar',
        area: '1200',
        built_up_area: '',
        road_width: '30',
        approved: 'CMDA/DTCP approved',
        corner: 'no',
        flood_prone: 'no',
        notes: '',

        // Independent house / Apartment fields
        bhk: '2',
        bathrooms: '2',
        age: '5',
        floor: '3',
        total_floors: '5',
        parking: '1 car',
        furnished: '0',
        facing: 'North',
        lift: 'no',
        power_backup: 'no',
        gated: 'no',

        // Commercial fields
        commercial_subtype: 'Shop',
        frontage_ft: '25',
        parking_slots: '2',
        comm_furnished: 'bare shell',
        main_road_facing: 'yes',

        // Plot fields
        plot_shape: 'regular',
        boundary_wall: 'yes',

        // Distances & Amenities
        school_dist: '',
        hospital_dist: '',
        bus_dist: '',
        metro_dist: '',
        supermarket_dist: '',
        park_dist: '',
        amenity_score: 75,
      });

      // Text descriptions of nearest places
      const [nearestTexts, setNearestTexts] = useState({
        school: '',
        college: '',
        hospital: '',
        clinic_pharmacy: '',
        supermarket: '',
        bus: '',
        metro: '',
        park: '',
        bank: '',
      });

      const [predicting, setPredicting]   = useState(false);
      const [prediction, setPrediction]   = useState(null);
      const [predError, setPredError]     = useState('');
      const [nearbyPlaces, setNearbyPlaces] = useState([]);
      const [nearbySummary, setNearbySummary] = useState(null);
      const [nearbyLoading, setNearbyLoading] = useState(false);
      const [nearbyError, setNearbyError] = useState('');
      const [soilData, setSoilData]       = useState(null);
      const [soilLoading, setSoilLoading] = useState(false);
      const [soilError, setSoilError]     = useState('');
      const [soilConnected, setSoilConnected] = useState(false);
      const soilIntervalRef = useRef(null);
      const setF = (k, v) => setForm(f => ({ ...f, [k]: v }));

      // Coverage caching and badge state
      const [coverageData, setCoverageData] = useState({
        bounds: { lat_min: 12.7, lat_max: 13.3, lng_min: 79.9, lng_max: 80.4 },
        localities: DEFAULT_LOCALITIES
      });
      const [coverageBadge, setCoverageBadge] = useState(null);
      const coverageCacheRef = useRef(null);

      // Fetch /coverage once and cache
      useEffect(() => {
        fetch(`${API}/api/predict/coverage`)
          .then(r => r.json())
          .then(d => {
            if (d && d.localities) {
              setCoverageData(d);
              coverageCacheRef.current = d;
            }
          })
          .catch(e => console.warn('Could not fetch coverage, using defaults:', e));
      }, []);

      const resolveCoverageBadge = (lat, lng, localityName) => {
        const bounds = coverageData.bounds || { lat_min: 12.7, lat_max: 13.3, lng_min: 79.9, lng_max: 80.4 };
        const localities = coverageData.localities || DEFAULT_LOCALITIES;

        // 1. Check Chennai metro bounds
        if (lat < bounds.lat_min || lat > bounds.lat_max || lng < bounds.lng_min || lng > bounds.lng_max) {
          return {
            type: 'red',
            badgeText: 'Outside supported area (Chennai metro only)',
            title: 'Outside supported area (Chennai metro only)',
            text: `Coordinates (${lat.toFixed(4)}, ${lng.toFixed(4)}) are outside Chennai metropolitan bounds (lat 12.7–13.3, lng 79.9–80.4).`,
            disabled: true,
            locality: localityName || 'Outside Chennai',
            reason: 'Predict is disabled because the selected coordinates are outside the Chennai metro coverage area.'
          };
        }

        // 2. Find nearest locality
        let nearestLoc = localities[0];
        let minDist = Infinity;
        localities.forEach(loc => {
          const d = HAVERSINE(lat, lng, loc.centroid.lat, loc.centroid.lng);
          if (d < minDist) {
            minDist = d;
            nearestLoc = loc;
          }
        });

        // 3. Over 8 km from any supported locality
        if (minDist > 8.0) {
          return {
            type: 'red',
            badgeText: 'Outside supported area (Chennai metro only)',
            title: 'Outside supported area (Chennai metro only)',
            text: `Selected point is ${minDist.toFixed(1)} km from nearest known area '${nearestLoc.name}' (max coverage is 8.0 km).`,
            disabled: true,
            locality: nearestLoc.name,
            reason: `Predict is disabled because the location is ${minDist.toFixed(1)} km from the nearest supported area (max 8.0 km).`
          };
        }

        // 4. Assumed-rate locality
        if (nearestLoc.status === 'assumed') {
          return {
            type: 'amber',
            badgeText: `Uses placeholder rates for ${nearestLoc.name}`,
            title: `Uses placeholder rates for ${nearestLoc.name}`,
            text: `Base rates for ${nearestLoc.name} are benchmark estimates. Prediction interval reflects this uncertainty.`,
            disabled: false,
            locality: nearestLoc.name,
            distanceKm: minDist
          };
        }

        // 5. 3 to 8 km: extrapolated
        if (minDist > 3.0) {
          return {
            type: 'amber',
            badgeText: `Nearest known area: ${nearestLoc.name} (${minDist.toFixed(1)} km away), estimate is less reliable`,
            title: `Nearest known area: ${nearestLoc.name} (${minDist.toFixed(1)} km away), estimate is less reliable`,
            text: `Location is ${minDist.toFixed(1)} km from ${nearestLoc.name} centroid. Prediction interval is widened by 1.5x.`,
            disabled: false,
            locality: nearestLoc.name,
            distanceKm: minDist
          };
        }

        // 6. <= 3 km and trained
        return {
          type: 'green',
          badgeText: `Covered: ${nearestLoc.name}`,
          title: `Covered: ${nearestLoc.name}`,
          text: `Well-supported locality with measured training coverage (${minDist.toFixed(1)} km from centroid).`,
          disabled: false,
          locality: nearestLoc.name,
          distanceKm: minDist
        };
      };

      // ── Select and focus a location on map ───────────────────────────────────
      const selectLocation = (lat, lng, label) => {
        const map = leafletMapRef.current;
        if (!map) return;

        map.flyTo([lat, lng], 15, { duration: 1.2 });

        if (markerRef.current) { markerRef.current.remove(); markerRef.current = null; }
        markerRef.current = L.marker([lat, lng])
          .addTo(map)
          .bindPopup(`<strong>${escapeHtml(label) || `${lat.toFixed(4)}, ${lng.toFixed(4)}`}</strong>`)
          .openPopup();

        if (radiusCircleRef.current) { radiusCircleRef.current.remove(); radiusCircleRef.current = null; }
        radiusCircleRef.current = L.circle([lat, lng], {
          radius: radius,
          color: '#16a34a',
          fillColor: '#22c55e',
          fillOpacity: 0.1,
          weight: 2
        }).addTo(map);

        setShowPanel(true);
        setPrediction(null);
        setPredError('');
        setNearbyPlaces([]);
        setNearbySummary(null);

        // Resolve coverage badge and locality
        const badge = resolveCoverageBadge(lat, lng);
        setCoverageBadge(badge);
        const resolvedLocality = badge.locality || 'Anna Nagar';

        setClickedLocation({
          lat,
          lng,
          address: label || `${lat.toFixed(5)}, ${lng.toFixed(5)}`,
          locality: resolvedLocality
        });
        setForm(f => ({ ...f, locality: resolvedLocality }));

        fetchNearbySurroundings(lat, lng, radius);
      };

      // ── Initialise Leaflet with Dynamic Tile Fallback ─────────────────────────
      useEffect(() => {
        if (!mapContainerRef.current || leafletMapRef.current) return;
        const map = L.map(mapContainerRef.current).setView([13.0827, 80.2707], 12);

        // Standard OSM tile layer
        let tileLayer = L.tileLayer(MAP_CONFIG.tileUrl, {
          attribution: MAP_CONFIG.attribution,
          maxZoom: MAP_CONFIG.maxZoom,
        }).addTo(map);

        // Dynamic fallback to CARTO tiles on repeated errors
        tileLayer.on('tileerror', () => {
          tileErrorCountRef.current += 1;
          if (tileErrorCountRef.current >= 3 && !fallbackActiveRef.current) {
            fallbackActiveRef.current = true;
            console.warn('Primary tile access failed; switching to CARTO fallback tiles.');
            map.removeLayer(tileLayer);
            if (map.attributionControl) {
              map.attributionControl.removeAttribution(MAP_CONFIG.attribution);
            }
            L.tileLayer(MAP_CONFIG.fallbackTileUrl, {
              attribution: MAP_CONFIG.fallbackAttribution,
              maxZoom: MAP_CONFIG.maxZoom,
              subdomains: 'abcd'
            }).addTo(map);
          }
        });

        nearbyLayerRef.current = L.layerGroup().addTo(map);
        leafletMapRef.current  = map;

        map.on('click', (e) => {
          const { lat, lng } = e.latlng;
          selectLocation(lat, lng, `${lat.toFixed(5)}, ${lng.toFixed(5)}`);
        });

        return () => {
          if (leafletMapRef.current) {
            leafletMapRef.current.remove();
            leafletMapRef.current = null;
          }
        };
      }, []);

      // ── Update circle & reload surroundings on radius change ────────────────
      useEffect(() => {
        if (radiusCircleRef.current && clickedLocation) {
          radiusCircleRef.current.setRadius(radius);
          fetchNearbySurroundings(clickedLocation.lat, clickedLocation.lng, radius);
        }
      }, [radius]);

      // ── Instant Local Suggestions (Min 2 chars, zero network calls) ──────────
      const handleSearchInputChange = (val) => {
        setSearchQuery(val);
        setSearchError('');
        const trimmed = val.trim();
        if (trimmed.length < 2) {
          setLocalSuggestions([]);
          setExternalResults([]);
          setShowSearchDropdown(false);
          return;
        }

        const q = trimmed.toLowerCase();
        const locs = coverageData.localities || DEFAULT_LOCALITIES;
        const matches = [];

        locs.forEach(loc => {
          const nameLower = loc.name.toLowerCase();
          const matchedAlias = (loc.aliases || []).find(a => a.toLowerCase().includes(q));
          if (nameLower.includes(q)) {
            matches.push({ type: 'locality', name: loc.name, matchType: 'name', centroid: loc.centroid });
          } else if (matchedAlias) {
            matches.push({ type: 'locality', name: loc.name, matchType: 'alias', matchedAlias, centroid: loc.centroid });
          }
        });

        setLocalSuggestions(matches.slice(0, 8));
        setExternalResults([]);
        setShowSearchDropdown(true);
      };

      // ── External Geocoding on Enter / Button Click (Min 3 chars) ─────────────
      const executeBackendSearch = async () => {
        if (searchLoading) return;
        const q = searchQuery.trim();
        if (q.length < 3) {
          setSearchError('Please enter at least 3 characters to search.');
          setShowSearchDropdown(true);
          return;
        }

        // Check local search cache first
        const cached = searchCacheRef.current[q.toLowerCase()];
        if (cached) {
          setExternalResults(cached);
          setLocalSuggestions([]);
          setSearchError('');
          setShowSearchDropdown(true);
          return;
        }

        const reqId = ++searchReqIdRef.current;
        setSearchLoading(true);
        setSearchError('');
        setShowSearchDropdown(true);

        try {
          const res = await fetch(`${API}/api/places/search?q=${encodeURIComponent(q)}`);
          if (reqId !== searchReqIdRef.current) return; // Stale response guard

          if (res.status === 429) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.message || 'Search rate limit reached. Please wait a moment.');
          } else if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.message || 'Backend search service is unavailable.');
          }

          const data = await res.json();
          if (reqId !== searchReqIdRef.current) return;

          if (!data || data.length === 0) {
            setExternalResults([]);
            setSearchError('No matching places found in Chennai.');
          } else {
            searchCacheRef.current[q.toLowerCase()] = data;
            setExternalResults(data);
            setSearchError('');
          }
        } catch (err) {
          if (reqId !== searchReqIdRef.current) return;
          console.error('Search error:', err);
          const msg = !navigator.onLine
            ? 'No internet connection.'
            : (err.message || 'Unable to connect to search service.');
          setSearchError(msg);
          setExternalResults([]);
        } finally {
          if (reqId === searchReqIdRef.current) {
            setSearchLoading(false);
          }
        }
      };

      const [groupedPlaces, setGroupedPlaces] = useState({});
      const [collapsedCategories, setCollapsedCategories] = useState({});
      const markersMapRef = useRef(new Map());
      const nearbyAbortRef = useRef(null);

      // ── Render Category Markers with Ref Map for Interactive Click ───────────
      useEffect(() => {
        if (!nearbyLayerRef.current) return;
        nearbyLayerRef.current.clearLayers();
        markersMapRef.current.clear();

        nearbyPlaces.forEach(p => {
          if (!activeCategories.has(p.category)) return;
          const meta = CATEGORY_META[p.category] || { color: '#64748b', emoji: '📍', label: p.category };

          const icon = L.divIcon({
            html: `<div style="
              width: 28px;
              height: 28px;
              display: flex;
              align-items: center;
              justify-content: center;
              background: white;
              border: 2px solid ${meta.color};
              border-radius: 50%;
              box-shadow: 0 2px 8px rgba(0,0,0,0.18);
              font-size: 15px;
            ">${meta.emoji}</div>`,
            className: '',
            iconSize: [28, 28],
            iconAnchor: [14, 14]
          });

          const distLabel = p.distance_km != null ? `${p.distance_km} km` : `${p.distance_m || 0} m`;
          const marker = L.marker([p.lat, p.lng], { icon })
            .bindPopup(`<div style="min-width:140px">
              <strong>${escapeHtml(p.name)}</strong><br/>
              <span style="color:${escapeHtml(meta.color)};font-weight:600">${escapeHtml(meta.emoji)} ${escapeHtml(meta.label)}</span><br/>
              <span style="color:#64748b;font-size:0.75rem">${escapeHtml(distLabel)} away</span>
            </div>`);

          marker.addTo(nearbyLayerRef.current);
          if (p.id) markersMapRef.current.set(p.id, marker);
        });
      }, [nearbyPlaces, activeCategories]);

      // ── Fetch Surroundings via Backend Proxy Only ───────────────────────────
      const fetchNearbySurroundings = async (lat, lng, r) => {
        // Abort previous active request
        if (nearbyAbortRef.current) {
          nearbyAbortRef.current.abort();
        }
        const abortController = new AbortController();
        nearbyAbortRef.current = abortController;

        setNearbyLoading(true);
        setNearbyError('');
        try {
          const res = await fetch(`${API}/api/places/nearby?lat=${lat}&lng=${lng}&radius=${r}`, {
            signal: abortController.signal
          });

          if (!res.ok) {
            const errJson = await res.json().catch(() => ({}));
            if (res.status === 429) {
              throw new Error(errJson.message || 'Rate limit reached for nearby places. Please try again shortly.');
            }
            throw new Error(errJson.message || `Unable to load nearby places (${res.status}).`);
          }

          const data = await res.json();
          if (abortController.signal.aborted) return;

          const placesList = data?.places || [];
          const grouped = data?.grouped || {};
          setNearbyPlaces(placesList);
          setGroupedPlaces(grouped);
          setNearbySummary({
            counts: data?.counts || {},
            nearest: data?.nearest || {},
            school_dist_km: data?.school_dist_km,
            metro_dist_km: data?.metro_dist_km
          });

          // Helper to format descriptive distance
          const formatNearestDesc = (categoryKey, fallbackLabel) => {
            const list = grouped[categoryKey] || [];
            if (list.length === 0) {
              const radLabel = r < 1000 ? `${r}m` : `${r / 1000} km`;
              return `None found within ${radLabel}`;
            }
            const nearest = list[0];
            const distLabel = nearest.distance_m < 1000 ? `${nearest.distance_m} m` : `${nearest.distance_km} km`;
            const name = nearest.name || `an unnamed ${fallbackLabel}`;
            return `${distLabel} from here there is ${name}`;
          };

          // Find nearest for clinic/pharmacy combined
          const clinicList = [...(grouped['clinic'] || []), ...(grouped['pharmacy'] || [])].sort((a,b) => a.distance_m - b.distance_m);
          let clinicPharmDesc = '';
          if (clinicList.length === 0) {
            const radLabel = r < 1000 ? `${r}m` : `${r / 1000} km`;
            clinicPharmDesc = `None found within ${radLabel}`;
          } else {
            const n = clinicList[0];
            const d = n.distance_m < 1000 ? `${n.distance_m} m` : `${n.distance_km} km`;
            clinicPharmDesc = `${d} from here there is ${n.name || 'a clinic / pharmacy'}`;
          }

          setNearestTexts({
            school:          formatNearestDesc('school', 'school'),
            college:         formatNearestDesc('college', 'college'),
            hospital:        formatNearestDesc('hospital', 'hospital'),
            clinic_pharmacy: clinicPharmDesc,
            supermarket:     formatNearestDesc('supermarket', 'supermarket'),
            bus:             formatNearestDesc('bus', 'bus stop'),
            metro:           formatNearestDesc('metro', 'metro station'),
            park:            formatNearestDesc('park', 'park'),
            bank:            formatNearestDesc('bank', 'bank/ATM'),
          });

          // Numeric distances for model: return actual distance if found, or '' (empty) to allow honest imputation
          const getNumDist = (catKey) => {
            const list = grouped[catKey] || [];
            if (list.length > 0) return String(list[0].distance_km);
            return '';
          };

          const sDist = getNumDist('school');
          const hDist = getNumDist('hospital');
          const bDist = getNumDist('bus');
          const mDist = getNumDist('metro');
          const smDist = getNumDist('supermarket');
          const pDist = getNumDist('park');

          // Compute Amenity Score (0-100) based on counts and distances
          const counts = data?.counts || {};
          const totalAmenities = placesList.length;
          let score = 50;
          score += Math.min(25, totalAmenities * 2.5); // more amenities
          const mVal = mDist ? parseFloat(mDist) : 3.0;
          const sVal = sDist ? parseFloat(sDist) : 1.5;
          const bVal = bDist ? parseFloat(bDist) : 1.0;
          const hVal = hDist ? parseFloat(hDist) : 2.0;
          if (mVal <= 1.0) score += 12;
          else if (mVal <= 2.5) score += 6;
          if (sVal <= 1.0) score += 8;
          if (bVal <= 0.5) score += 8;
          if (hVal <= 1.5) score += 7;
          score = Math.max(10, Math.min(100, Math.round(score)));

          setForm(f => ({
            ...f,
            school_dist: sDist,
            hospital_dist: hDist,
            bus_dist: bDist,
            metro_dist: mDist,
            supermarket_dist: smDist,
            park_dist: pDist,
            amenity_score: score,
          }));
        } catch (err) {
          if (err.name === 'AbortError') return;
          console.error('Surroundings error:', err);
          setNearbyError(err.message || 'Unable to retrieve surrounding amenities.');
          setNearbyPlaces([]);
          setGroupedPlaces({});
          setNearbySummary(null);
        } finally {
          if (!abortController.signal.aborted) {
            setNearbyLoading(false);
          }
        }
      };

      const focusPlaceMarker = (place) => {
        const map = leafletMapRef.current;
        if (!map || !place) return;
        map.panTo([place.lat, place.lng], { animate: true, duration: 0.8 });
        const marker = markersMapRef.current.get(place.id);
        if (marker) {
          marker.openPopup();
        }
      };

      const toggleCategoryAccordion = (cat) => {
        setCollapsedCategories(prev => ({
          ...prev,
          [cat]: !prev[cat]
        }));
      };

      // ── Soil sensor polling ─────────────────────────────────────────────────
      useEffect(() => {
        if (soilConnected && form.type === 'plot') {
          fetchSoilData();
          soilIntervalRef.current = setInterval(fetchSoilData, 5000);
        } else {
          clearInterval(soilIntervalRef.current);
        }
        return () => clearInterval(soilIntervalRef.current);
      }, [soilConnected, form.type]);

      const fetchSoilData = async () => {
        setSoilLoading(true); setSoilError('');
        try {
          const ctrl = new AbortController();
          const tid  = setTimeout(() => ctrl.abort(), 3500);
          const res  = await fetch('http://localhost:5000/api/soil', { signal: ctrl.signal });
          clearTimeout(tid);
          if (!res.ok) throw new Error('offline');
          setSoilData(await res.json());
        } catch {
          setSoilError('Sensor offline. Make sure ESP32 is running on port 5000.');
        } finally { setSoilLoading(false); }
      };

      const getSoilMetric = (key, value) => {
        const ranges = {
          ph:         { good: [6.0, 7.5], mod: [5.5, 8.0] },
          moisture:   { good: [30, 70],   mod: [20, 80]   },
          nitrogen:   { good: [200, 400], mod: [100, 500]  },
          phosphorus: { good: [10, 30],   mod: [5, 50]    },
          potassium:  { good: [100, 250], mod: [50, 350]  },
          temperature:{ good: [15, 30],   mod: [10, 35]   },
        };
        const r = ranges[key];
        if (!r || value == null) return { color: '#9ca3af', bg: '#f3f4f6', label: '—' };
        if (value >= r.good[0] && value <= r.good[1]) return { color: '#0369a1', bg: '#f0f9ff', label: 'Typical range' };
        if (value >= r.mod[0]  && value <= r.mod[1])  return { color: '#d97706', bg: '#fffbeb', label: 'Outside typical' };
        return { color: '#92400e', bg: '#fef3c7', label: 'Check value' };
      };

      // Collapsible geotechnical info section — informational only, not used in price estimate
      const GeoTechSection = ({ form: f, setF: sf }) => {
        const [open, setOpen] = React.useState(false);
        return (
          <div style={{ gridColumn: 'span 2', marginTop: 10, border: '1px solid #e2e8f0', borderRadius: 8, overflow: 'hidden' }}>
            <button
              type="button"
              onClick={() => setOpen(o => !o)}
              style={{ width: '100%', textAlign: 'left', padding: '10px 14px', background: '#f8fafc', border: 'none', cursor: 'pointer', fontSize: '0.8rem', fontWeight: 600, color: '#334155', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}
            >
              <span>🏗️ Site &amp; soil information (from a geotechnical report or owner records)</span>
              <span style={{ fontSize: '0.72rem', color: '#64748b' }}>{open ? '▲ Collapse' : '▼ Expand (optional)'}</span>
            </button>
            {open && (
              <div style={{ padding: '14px', background: 'white', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                <div style={{ gridColumn: 'span 2', background: '#fffbeb', border: '1px solid #fde68a', borderRadius: 6, padding: '8px 10px', fontSize: '0.73rem', color: '#92400e' }}>
                  ⚠️ These fields are informational only. They are <strong>not used in the price estimate</strong>. Foundation suitability requires borehole testing by a licensed geotechnical firm.
                </div>
                <div className="form-group">
                  <label className="form-label">Geotechnical report available</label>
                  <select className="form-select" style={{ fontSize: '0.8rem' }} value={f.geotech_report || ''} onChange={e => sf('geotech_report', e.target.value)}>
                    <option value="">— select —</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                    <option value="not_sure">Not sure</option>
                  </select>
                </div>
                <div className="form-group">
                  <label className="form-label">Dominant soil type</label>
                  <select className="form-select" style={{ fontSize: '0.8rem' }} value={f.geotech_soil_type || ''} onChange={e => sf('geotech_soil_type', e.target.value)}>
                    <option value="">— select —</option>
                    <option value="sand">Sand</option>
                    <option value="silt">Silt</option>
                    <option value="clay">Clay</option>
                    <option value="gravel">Gravel</option>
                    <option value="weathered rock">Weathered rock</option>
                    <option value="fill or made-up ground">Fill or made-up ground</option>
                    <option value="unknown">Unknown</option>
                  </select>
                </div>
                <div className="form-group">
                  <label className="form-label">Groundwater depth (metres)</label>
                  <input className="form-input" type="number" min="0" max="500" step="0.5" style={{ fontSize: '0.8rem' }} value={f.geotech_gw_depth || ''} onChange={e => sf('geotech_gw_depth', e.target.value)} placeholder="e.g. 3.5" />
                </div>
                <div className="form-group">
                  <label className="form-label">Date groundwater measured</label>
                  <input className="form-input" type="text" style={{ fontSize: '0.8rem' }} value={f.geotech_gw_date || ''} onChange={e => sf('geotech_gw_date', e.target.value)} placeholder="e.g. Oct 2024" />
                </div>
                <div className="form-group">
                  <label className="form-label">Safe bearing capacity (kN/m²)</label>
                  <input className="form-input" type="number" min="0" max="10000" style={{ fontSize: '0.8rem' }} value={f.geotech_sbc || ''} onChange={e => sf('geotech_sbc', e.target.value)} placeholder="Must be from borehole report" />
                </div>
                <div className="form-group">
                  <label className="form-label">SPT N-value (blows)</label>
                  <input className="form-input" type="number" min="0" max="300" style={{ fontSize: '0.8rem' }} value={f.geotech_spt || ''} onChange={e => sf('geotech_spt', e.target.value)} placeholder="From borehole report" />
                </div>
                <div className="form-group">
                  <label className="form-label">Flood or waterlogging history</label>
                  <select className="form-select" style={{ fontSize: '0.8rem' }} value={f.geotech_flood || ''} onChange={e => sf('geotech_flood', e.target.value)}>
                    <option value="">— select —</option>
                    <option value="never">Never</option>
                    <option value="once">Once</option>
                    <option value="repeatedly">Repeatedly</option>
                    <option value="unknown">Unknown</option>
                  </select>
                </div>
                <div className="form-group">
                  <label className="form-label">Previously a water body / lake bed</label>
                  <select className="form-select" style={{ fontSize: '0.8rem' }} value={f.geotech_prev_water || ''} onChange={e => sf('geotech_prev_water', e.target.value)}>
                    <option value="">— select —</option>
                    <option value="yes">Yes (former lake/tank bed)</option>
                    <option value="no">No</option>
                    <option value="unknown">Unknown</option>
                  </select>
                </div>
                <div className="form-group full" style={{ gridColumn: 'span 2' }}>
                  <label className="form-label">Report date &amp; issuing agency</label>
                  <input className="form-input" type="text" style={{ fontSize: '0.8rem' }} value={f.geotech_report_agency || ''} onChange={e => sf('geotech_report_agency', e.target.value)} placeholder="e.g. Nov 2023, Madras Geotech Labs" />
                </div>
              </div>
            )}
          </div>
        );
      };

      const handlePredict = async () => {
        setPredError('');
        const areaVal = Number(form.area);
        if (!areaVal || areaVal <= 0) {
          setPredError('Please enter a valid area in sqft (greater than 0).');
          return;
        }
        const schoolDistVal = Number(form.school_dist);
        if (isNaN(schoolDistVal) || schoolDistVal <= 0) {
          setPredError('Distance to school must be greater than 0 km.');
          return;
        }
        const metroDistVal = Number(form.metro_dist);
        if (isNaN(metroDistVal) || metroDistVal <= 0) {
          setPredError('Distance to metro must be greater than 0 km.');
          return;
        }

        setPredicting(true);
        setPrediction(null);
        try {
          // Parking encoding
          let parkingVal = 1;
          if (form.parking === 'none') parkingVal = 0;
          else if (form.parking === 'bike') parkingVal = 1;
          else if (form.parking === '1 car') parkingVal = 1;
          else if (form.parking === '2+ cars') parkingVal = 2;
          else if (form.parking === 'yes') parkingVal = 1;
          else if (form.parking === 'no') parkingVal = 0;

          // Furnished encoding
          let furnishedVal = 0;
          if (form.property_type === 'Commercial') {
            if (form.comm_furnished === 'warm shell') furnishedVal = 1;
            else if (form.comm_furnished === 'furnished') furnishedVal = 2;
            else furnishedVal = 0;
          } else {
            furnishedVal = Number(form.furnished) || 0;
          }

          // Helper to pass distance as number or null (never silently inject fake defaults)
          const parseDist = (v) => (v !== '' && v !== null && v !== undefined && !isNaN(Number(v))) ? Number(v) : null;

          const res = await fetch(`${API}/api/predict`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              property_type:       form.property_type,
              locality:            form.locality || (clickedLocation ? clickedLocation.locality : 'Anna Nagar'),
              lat:                 clickedLocation ? clickedLocation.lat : undefined,
              lng:                 clickedLocation ? clickedLocation.lng : undefined,
              area_sqft:           areaVal,
              built_up_sqft:       form.built_up_area ? Number(form.built_up_area) : 0,
              road_width_ft:       Number(form.road_width) || 30,
              approved:            form.approved,
              corner:              form.corner === 'yes' ? 1 : 0,
              flood_prone:         form.flood_prone === 'yes' ? 1 : 0,

              // Housing / Apt
              bhk:                 Number(form.bhk) || 0,
              bathrooms:           Number(form.bathrooms) || 0,
              age_years:           Math.max(0, Number(form.age) || 0),
              floor:               Math.max(0, Number(form.floor) || 0),
              total_floors:        Math.max(1, Number(form.total_floors) || 1),
              parking:             parkingVal,
              furnished:           furnishedVal,
              lift:                form.lift === 'yes' ? 1 : 0,
              power_backup:        form.power_backup === 'yes' ? 1 : 0,
              gated:               form.gated === 'yes' ? 1 : 0,
              facing:              form.facing || 'North',

              // Commercial
              commercial_subtype:  form.property_type === 'Commercial' ? form.commercial_subtype : 'none',
              frontage_ft:         form.property_type === 'Commercial' ? (Number(form.frontage_ft) || 0) : 0,

              // Distances & Amenities (null triggers measured training median imputation)
              school_dist_km:      parseDist(form.school_dist),
              hospital_dist_km:    parseDist(form.hospital_dist),
              bus_dist_km:         parseDist(form.bus_dist),
              metro_dist_km:       parseDist(form.metro_dist),
              supermarket_dist_km: parseDist(form.supermarket_dist),
              park_dist_km:        parseDist(form.park_dist),
              amenity_score:       Number(form.amenity_score) || 75,
              notes:               form.notes || '',
              site_info: (form.property_type === 'Residential Plot' || form.property_type === 'Independent House/Villa') ? {
                geotech_report_available: form.geotech_report || undefined,
                dominant_soil_type:       form.geotech_soil_type || undefined,
                groundwater_depth_m:      form.geotech_gw_depth ? Number(form.geotech_gw_depth) : undefined,
                groundwater_date:         form.geotech_gw_date || undefined,
                safe_bearing_capacity:    form.geotech_sbc ? Number(form.geotech_sbc) : undefined,
                spt_n_value:              form.geotech_spt ? Number(form.geotech_spt) : undefined,
                flood_history:            form.geotech_flood || undefined,
                prev_water_body:          form.geotech_prev_water || undefined,
                report_agency:            form.geotech_report_agency || undefined,
              } : undefined,
            })
          });
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            let errMsg = 'Prediction failed';
            if (errData.detail) {
              if (typeof errData.detail === 'string') errMsg = errData.detail;
              else if (errData.detail.message) errMsg = errData.detail.message;
              else if (errData.detail.errors) errMsg = errData.detail.errors.map(e => e.message || e.msg).join('; ');
            } else if (errData.message) {
              errMsg = errData.message;
            } else if (errData.errors) {
              errMsg = errData.errors.map(e => e.message).join('; ');
            } else if (errData.error) {
              errMsg = errData.error;
            }
            throw new Error(errMsg);
          }
          const data = await res.json();
          setPrediction(data);
          if (markerRef.current) {
            const priceLabel = formatINR(data.predicted_price);
            const rangeLow   = formatINR(data.range_low);
            const rangeHigh  = formatINR(data.range_high);
            const badgeText = data.data_source === 'synthetic+real' ? `Real Data (${data.n_real_rows || '200+'} rows)` : 'DEMO ESTIMATE';
            const badgeBg = data.data_source === 'synthetic+real' ? '#dcfce7' : '#f1f5f9';
            const badgeColor = data.data_source === 'synthetic+real' ? '#166534' : '#475569';
            const intervalPct = Math.round((data.interval_coverage || 0.8) * 100);
            markerRef.current
              .bindPopup(`<div style="font-family:sans-serif;min-width:210px">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
                  <span style="font-size:0.65rem;text-transform:uppercase;letter-spacing:.06em;color:#16a34a;font-weight:700">Estimated Value</span>
                  <span style="font-size:0.62rem;background:${badgeBg};color:${badgeColor};border:1px solid #cbd5e1;padding:1px 6px;border-radius:999px;font-weight:700">${escapeHtml(badgeText)}</span>
                </div>
                <div style="font-size:1.25rem;font-weight:800;color:#0f172a;margin-bottom:3px">${priceLabel}</div>
                <div style="font-size:0.75rem;color:#334155;font-weight:600;margin-bottom:3px">Likely range (${intervalPct}% interval): ${rangeLow} – ${rangeHigh}</div>
                <div style="font-size:0.7rem;color:#64748b">₹${(data.price_per_sqft || 0).toLocaleString('en-IN')}/sqft · ${escapeHtml(data.resolved_locality || form.locality)}</div>
                <div style="font-size:0.66rem;color:#b45309;font-style:italic;margin-top:4px">⚠️ ${escapeHtml(data.warning || "Demo estimate. Not a valuation.")}</div>
              </div>`, { maxWidth: 260 })
              .openPopup();
          }
        } catch (err) {
          setPredError(err.message || 'Prediction failed. Check backend & ML service are running.');
        } finally {
          setPredicting(false);
        }
      };

      const toggleCategory = (cat) => {
        setActiveCategories(prev => {
          const next = new Set(prev);
          if (next.has(cat)) next.delete(cat);
          else next.add(cat);
          return next;
        });
      };

      // Nearest unique place per category for the side panel
      const nearestPerCategory = {};
      nearbyPlaces.forEach(p => {
        if (!activeCategories.has(p.category)) return;
        if (!nearestPerCategory[p.category]) nearestPerCategory[p.category] = p;
      });

      return (
        <div className="section map-section" style={{ paddingTop: 100 }}>
          <div className="section-inner">
            <div className="fade-up">
              <span className="section-label">Map Explorer</span>
              <h1 className="section-title">Explore Neighborhoods & Surroundings</h1>
              <p className="section-sub">Search or click anywhere in Chennai to inspect schools, transit, and amenities with real-time neighborhood data.</p>
            </div>

            <div className="map-layout" style={{ marginTop: 36 }}>
              {/* Map Column */}
              <div className="fade-up fade-up-d1">
                <div className="leaflet-map-wrap" style={{ position: 'relative' }}>
                  {/* Search bar inside map */}
                  <div className="map-search-bar">
                    <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                      <input
                        className="map-search-input"
                        type="text"
                        placeholder="🔍 Search (e.g. Adyar, T Nagar)..."
                        value={searchQuery}
                        onChange={e => handleSearchInputChange(e.target.value)}
                        onKeyDown={e => { if (e.key === 'Enter') executeBackendSearch(); }}
                        onFocus={() => { if (localSuggestions.length > 0 || externalResults.length > 0 || searchError) setShowSearchDropdown(true); }}
                      />
                      <button
                        type="button"
                        className="btn-primary"
                        disabled={searchLoading}
                        style={{
                          padding: '9px 14px',
                          fontSize: '0.82rem',
                          whiteSpace: 'nowrap',
                          opacity: searchLoading ? 0.6 : 1,
                          cursor: searchLoading ? 'not-allowed' : 'pointer'
                        }}
                        onClick={executeBackendSearch}
                      >
                        {searchLoading ? '...' : 'Search'}
                      </button>
                    </div>

                    {showSearchDropdown && (
                      <div className="map-search-dropdown">
                        {searchLoading && (
                          <div style={{ padding: '12px 14px', fontSize: '0.82rem', color: 'var(--muted)', display: 'flex', alignItems: 'center', gap: 8 }}>
                            <div className="spinner" style={{ width: 14, height: 14 }} /> Searching Chennai places...
                          </div>
                        )}
                        {!searchLoading && searchError && (
                          <div style={{ padding: '12px 14px', fontSize: '0.82rem', color: '#ef4444', display: 'flex', flexDirection: 'column', gap: 6 }}>
                            <div>⚠️ {searchError}</div>
                            <button
                              type="button"
                              className="btn-primary"
                              style={{ alignSelf: 'flex-start', padding: '3px 10px', fontSize: '0.74rem', background: '#dc2626', borderColor: '#b91c1c' }}
                              onClick={executeBackendSearch}
                            >
                              🔄 Retry Search
                            </button>
                          </div>
                        )}

                        {/* Instant Local Suggestions */}
                        {!searchLoading && localSuggestions.length > 0 && (
                          <div>
                            <div style={{ padding: '6px 12px', fontSize: '0.7rem', fontWeight: 700, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.05em', background: '#f8fafc', borderBottom: '1px solid #f1f5f9' }}>
                              Suggested Localities (Instant)
                            </div>
                            {localSuggestions.map(s => (
                              <div
                                key={s.name}
                                className="map-search-item"
                                onMouseDown={() => {
                                  setSearchQuery(s.name);
                                  setShowSearchDropdown(false);
                                  selectLocation(s.centroid.lat, s.centroid.lng, s.name);
                                }}
                              >
                                📍 <strong>{s.name}</strong>
                                {s.matchType === 'alias' && <span style={{ fontSize: '0.75rem', color: 'var(--muted)', marginLeft: 6 }}>({s.matchedAlias})</span>}
                              </div>
                            ))}
                          </div>
                        )}

                        {/* External Results */}
                        {!searchLoading && externalResults.length > 0 && (
                          <div>
                            <div style={{ padding: '6px 12px', fontSize: '0.7rem', fontWeight: 700, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.05em', background: '#f8fafc', borderBottom: '1px solid #f1f5f9' }}>
                              Street-Level Results
                            </div>
                            {externalResults.map(res => (
                              <div
                                key={res.place_id || `${res.lat}_${res.lon}`}
                                className="map-search-item"
                                onMouseDown={() => {
                                  const name = res.display_name.split(',')[0];
                                  setSearchQuery(name);
                                  setShowSearchDropdown(false);
                                  selectLocation(parseFloat(res.lat), parseFloat(res.lon), name);

                              </div>

                          </div>

                        {!searchLoading && !searchError && localSuggestions.length === 0 && externalResults.length === 0 && (
                          <div style={{ padding: '12px 14px', fontSize: '0.82rem', color: 'var(--muted)' }}>

                  </div>

                  <div ref={mapContainerRef} style={{ height: '100%', width: '100%' }} />
                </div>

                {/* Radius Selector & Category Filters */}

                    <div style={{ fontSize: '0.86rem', fontWeight: 600, color: 'var(--slate)' }}>

                    <div style={{ display: 'flex', gap: 6 }}>

                            </div>
                          </div>
